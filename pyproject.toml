[project]
name = "comicly-backend"
version = "2.0.0"
description = "Comicly illustrative reader backend - consistent character/style image generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aioboto3>=13.0.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "sse-starlette>=2.1.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "google-genai>=1.0.0",
    "pypdf>=5.0.0",
    "ebooklib>=0.19",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tiktoken>=0.8.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.10.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
