services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comicly
      POSTGRES_PASSWORD: comicly
      POSTGRES_DB: comicly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comicly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-change-me-in-prod
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://comicly:comicly@postgres:5432/comicly
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/comicly
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./app:/code/app

  worker:
    build: .
    depends_on:
      - postgres
      - redis
      - minio
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://comicly:comicly@postgres:5432/comicly
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: arq app.workers.tasks.WorkerSettings
    volumes:
      - ./app:/code/app

volumes:
  pgdata:
  miniodata:
